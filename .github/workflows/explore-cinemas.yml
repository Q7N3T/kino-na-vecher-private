# Разведка: открываются ли сайты кинотеатров из GitHub, как устроены карты сайта со страницами
# фильмов и что есть на самой странице (название, год, номер IMDb) — чтобы сопоставить их с базой.
# Запускается вручную; ничего не меняет в репозитории — только пишет находки в лог.
name: Разведка кинотеатров

on:
  workflow_dispatch:

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Карты сайтов и страницы фильмов
        shell: python3 {0}
        run: |
          import gzip, re, urllib.request
          UA = "Mozilla/5.0 (compatible; kino-na-vecher/1.0; +https://github.com/Q7N3T/kino-na-vecher-private)"
          def get(u):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": UA}), timeout=40)
                  b = r.read()
                  if b[:2] == b"\x1f\x8b": b = gzip.decompress(b)
                  return r.status, r.url, b.decode("utf-8", "replace")
              except Exception as e:
                  return getattr(e, "code", "ERR"), u, str(e)
          locs = lambda t: re.findall(r"<loc>\s*([^<\s]+)\s*</loc>", t)
          SITEMAPS = {
              "ivi": ["https://www.ivi.ru/sitemap-watch-1.xml", "https://www.ivi.ru/sitemap-watch-4.xml"],
              "premier": ["https://premier.one/sitemap_main.xml"],
              "kion": ["https://kion.ru/sitemap2.xml", "https://kion.ru/sitemapstatic.xml"],
              "amediateka": ["https://www.amediateka.ru/sitemap-content.xml", "https://www.amediateka.ru/sitemap-seasons.xml"],
          }
          from collections import Counter
          for site, urls in SITEMAPS.items():
              print(f"::group::{site}")
              pages = []
              for u in urls:
                  code, final, t = get(u)
                  ls = locs(t)
                  print(f"{u} -> {code} {final if final != u else ''} ссылок: {len(ls)} байт: {len(t)}")
                  if u.endswith("robots.txt"):
                      print("\n".join(l for l in t.splitlines() if l.lower().startswith("sitemap"))[:800])
                      continue
                  # индекс карт — показываем дочерние и открываем пару, похожих на фильмы/сериалы
                  if "<sitemapindex" in t:
                      print("  дочерние:", *ls[:40], sep="\n    ")
                      kids = [l for l in ls if re.search(r"film|movie|serial|series|tv|content|catalog", l)][:3]
                      for k in kids:
                          c2, _, t2 = get(k); l2 = locs(t2)
                          print(f"  {k} -> {c2} ссылок: {len(l2)}"); print(*l2[:6], sep="\n    ")
                          pages += l2[:2]
                  else:
                      shapes = Counter("/".join(l.split("/")[3:5]) .split("/")[0] + "/" + str(l.count("/")) for l in ls)
                      print("  виды адресов:", shapes.most_common(12))
                      import random; random.seed(1)
                      smp = random.sample(ls, min(12, len(ls)))
                      print(*smp, sep="\n    ")
                      pages += [l for l in smp if l.count("/") <= 4][:2]
              # что на странице: заголовок, og, год, imdb, ld+json
              for p in pages[:2]:
                  code, final, t = get(p)
                  print(f"  СТРАНИЦА {p} -> {code} байт {len(t)}")
                  for pat in [r"<title>[^<]*</title>", r'property="og:title"[^>]*', r'"datePublished"\s*:\s*"[^"]*"',
                              r"imdb[^\"'<>\s]{0,40}", r'"@type"\s*:\s*"[A-Za-z]+"', r'"(?:year|releaseYear|alternateName|originalName|original_title)"\s*:\s*"?[^",}]*']:
                      m = re.findall(pat, t, re.I)[:3]
                      if m: print("    ", pat[:20], "→", m)
              print("::endgroup::")
