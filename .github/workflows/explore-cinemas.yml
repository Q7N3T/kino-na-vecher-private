# Пробный запуск: какие прямые ссылки на кинотеатры нашлись бы для нынешней базы (scripts/cinemas.py).
# Запускается вручную; ничего не меняет в репозитории — только пишет находки и примеры в лог.
name: Проверить ссылки на кинотеатры

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: data/cinema-cache.json
          key: cinema-cache-${{ github.run_id }}
          restore-keys: cinema-cache-
      - run: python3 scripts/cinemas.py
      # проверенные страницы сохраняются, даже если запуск упал или его прервали по времени
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/cinema-cache.json
          key: cinema-cache-${{ github.run_id }}
