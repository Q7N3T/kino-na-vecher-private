<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кино на вечер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17121A;--surface:#221A26;--line:#3A2E3F;
  --text:#F2EAE0;--muted:#A3959F;--accent:#E9B949;--accent-ink:#2A1E05;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#17121A;--text:#F2EAE0}}
:root[data-theme="dark"]{--bg:#17121A;--text:#F2EAE0}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
header.top{display:flex;justify-content:space-between;align-items:center;padding:20px 0}
.logo{font-family:var(--display);font-weight:700;font-size:15px;text-decoration:none;display:flex;align-items:center;gap:10px}
.logo i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.now{color:var(--muted);font-size:14px}

.hero{padding:48px 0 32px}
.sentence{font-family:var(--display);font-weight:500;font-size:clamp(28px,5.2vw,60px);line-height:1.18;margin:0;max-width:22ch;letter-spacing:-.01em}
.slot{border:0;background:none;padding:0;cursor:pointer;font:inherit;color:var(--accent);border-bottom:3px solid var(--accent);line-height:1.05}
.slot:hover{color:#F7D27A;border-color:#F7D27A}
.pickers{display:grid;gap:18px;margin-top:36px}
.picker-label{font-size:14px;color:var(--muted);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 16px;font-size:15px;cursor:pointer;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}

.today{display:none;margin:28px 0 0;padding:14px 18px;border:1px solid var(--accent);border-radius:12px;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.today.on{display:flex}
.today a{color:var(--accent);font-weight:500}

.bar{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;padding:28px 0 18px;border-top:1px solid var(--line);margin-top:36px}
.count{margin:0;font-size:18px}
.count span{color:var(--muted)}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:500;font-size:15px;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn:hover{filter:brightness(1.08)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:32px 20px;padding-bottom:64px}
.card{text-decoration:none;display:block}
.card .poster{transition:transform .2s ease}
.card:hover .poster{transform:translateY(-4px)}
.card h3{font-size:16px;font-weight:500;margin:12px 0 2px;line-height:1.3}
.card p{margin:0;color:var(--muted);font-size:14px}
.card .end{color:var(--text)}
.poster{aspect-ratio:2/3;width:100%;object-fit:cover;border-radius:6px;background:var(--surface)}
.poster.big{border-radius:10px}
.rest h2{font-family:var(--display);font-weight:500;font-size:18px;margin:0 0 6px}
.rest p.sub{color:var(--muted);margin:0 0 20px;font-size:15px}
.rest .grid .card{opacity:.75}
.rest .grid .card:hover{opacity:1}

.empty{padding:40px 0 64px;max-width:48ch}
.empty h2{font-family:var(--display);font-weight:500;font-size:24px;margin:0 0 8px}
.empty p{color:var(--muted);margin:0 0 20px}

.back{display:inline-flex;gap:8px;align-items:center;text-decoration:none;color:var(--muted);font-size:15px;padding:16px 0 8px}
.back:hover{color:var(--text)}
.film{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:56px;padding:24px 0 48px;align-items:start}
.film aside{position:sticky;top:24px}
.film h1{font-family:var(--display);font-weight:700;font-size:clamp(32px,4.6vw,54px);line-height:1.08;margin:0 0 6px;letter-spacing:-.01em}
.orig{color:var(--muted);margin:0 0 24px;font-size:17px}
.facts{display:flex;flex-wrap:wrap;gap:12px 28px;margin:0 0 28px;padding:0}
.facts div{display:flex;flex-direction:column}
.facts dt{font-size:13px;color:var(--muted)}
.facts dd{margin:0;font-weight:500}
.clock{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:0 0 32px;display:flex;gap:16px;align-items:center}
.clock b{font-family:var(--display);font-weight:500;font-size:28px;color:var(--accent);line-height:1}
.clock span{color:var(--muted);font-size:15px;line-height:1.4}
.logline{font-size:21px;line-height:1.45;max-width:46ch;margin:0 0 20px}
.syn{max-width:62ch;margin:0 0 28px;color:#D9CFC6}
.why{max-width:62ch;margin:0 0 28px;padding-left:16px;border-left:3px solid var(--accent)}
.why p{margin:0}
.why small{display:block;color:var(--muted);font-size:13px;margin-bottom:2px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 32px}
.tag{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;color:var(--muted)}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 40px}
.block{margin:0 0 32px;max-width:62ch}
.block h2{font-size:15px;font-weight:500;color:var(--muted);margin:0 0 10px}
.cast{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 24px}
.cast li span{display:block;color:var(--muted);font-size:14px}
.scores{display:flex;gap:28px}
.scores b{font-family:var(--display);font-weight:500;font-size:26px;display:block;line-height:1.1}
.scores span{color:var(--muted);font-size:14px}
.awards{list-style:none;margin:0;padding:0}
.awards li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px}
.awards li:last-child{border-bottom:0}
.awards span{color:var(--muted);font-size:14px;white-space:nowrap}
.links{display:flex;gap:20px;flex-wrap:wrap}
.links a{color:var(--accent)}
.more{border-top:1px solid var(--line);padding:32px 0 80px}
.more h2{font-family:var(--display);font-weight:500;font-size:22px;margin:0 0 20px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{color:var(--muted);font-size:13px;padding:0 0 32px}

@media (max-width:760px){
  .wrap{padding:0 18px}
  .hero{padding:28px 0 20px}
  .film{grid-template-columns:1fr;gap:28px}
  .film aside{position:static;max-width:260px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 14px}
  .now{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

  <main id="app"></main>
  <footer>Данные о фильмах: Кинопоиск, IMDb и материалы фестивалей.</footer>

const POSTERS = {"6553389": "posters/6553389.jpg", "1040690": "posters/1040690.jpg", "714248": "posters/714248.jpg", "425": "posters/425.jpg", "425400": "posters/425400.jpg", "5237750": "posters/5237750.jpg", "225011": "posters/225011.jpg", "1259195": "posters/1259195.jpg", "1347315": "posters/1347315.jpg", "677566": "posters/677566.jpg"};
const TIMES = [
 {v:105,word:"около полутора часов",chip:"Около 1,5 часа"},
 {v:130,word:"часа два",chip:"Часа два"},
 {v:999,word:"весь вечер",chip:"Весь вечер"}
];
const MOODS = [
 {v:"laugh",word:"посмеяться",tag:"Смешно"},
 {v:"nerve",word:"понервничать",tag:"Напряжённо"},
 {v:"sad",word:"погрустить",tag:"Грустно"},
 {v:"think",word:"подумать",tag:"Заставляет думать"},
 {v:"inspire",word:"вдохновиться",tag:"Вдохновляет"},
 {v:"any",word:"чего угодно",tag:""}
];
const state = {time:105, mood:"laugh"};
try{const s=JSON.parse(sessionStorage.getItem("knv-filter")||"null");if(s){state.time=s.time;state.mood=s.mood}}catch(e){}
const app = document.getElementById("app");

const pad = n => String(n).padStart(2,"0");
function endTime(min){const d=new Date(Date.now()+min*60000);return pad(d.getHours())+":"+pad(d.getMinutes())}
function dur(min){const h=Math.floor(min/60),m=min%60;return (h?h+" ч ":"")+(m?m+" мин":"")}
function plural(n,a,b,c){const m10=n%10,m100=n%100;if(m10===1&&m100!==11)return a;if(m10>=2&&m10<=4&&(m100<10||m100>=20))return b;return c}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function cap(s){return s[0].toUpperCase()+s.slice(1)}
function fits(f){return f.min<=state.time&&(state.mood==="any"||f.m.includes(state.mood))}

function poster(f,big){return `<img class="poster${big?" big":""}" src="${POSTERS[f.id]}" alt="Постер фильма «${esc(f.t)}»" loading="lazy">`}
function card(f){
  return `<a class="card" href="#film/${f.id}">${poster(f)}
    <h3>${esc(f.t)}</h3><p>${dur(f.min)}, финал в <span class="end">${endTime(f.min)}</span></p></a>`;
}
function getToday(){
  try{const s=JSON.parse(localStorage.getItem("knv-today")||"null");
    if(s&&s.date===new Date().toDateString())return FILMS.find(f=>f.id===s.id)||null;}catch(e){}
  return null;
}

function renderCatalog(){
  const t=TIMES.find(x=>x.v===state.time)||TIMES[0], m=MOODS.find(x=>x.v===state.mood)||MOODS[0];
  const list=FILMS.filter(fits).sort((a,b)=>a.min-b.min);
  const rest=FILMS.filter(f=>!fits(f)).sort((a,b)=>a.min-b.min);
  const today=getToday();
  document.title="Кино на вечер";
  app.innerHTML=`
  <section class="hero">
    <h1 class="sentence">Сегодня у меня <button class="slot" data-focus="lt">${t.word}</button>, и хочется <button class="slot" data-focus="lm">${m.word}</button></h1>
    <div class="pickers">
      <div><p class="picker-label" id="lt">Сколько есть времени</p>
        <div class="chips" role="group" aria-labelledby="lt">${TIMES.map(x=>`<button class="chip" data-time="${x.v}" aria-pressed="${x.v===state.time}">${x.chip}</button>`).join("")}</div></div>
      <div><p class="picker-label" id="lm">Какое настроение</p>
        <div class="chips" role="group" aria-labelledby="lm">${MOODS.map(x=>`<button class="chip" data-mood="${x.v}" aria-pressed="${x.v===state.mood}">${x.v==="any"?"Неважно":cap(x.word)}</button>`).join("")}</div></div>
    </div>
    <div class="today${today?" on":""}">${today?`<span>Вы уже выбрали на сегодня: <a href="#film/${today.id}">${esc(today.t)}</a></span><span style="color:var(--muted)">Финал в ${endTime(today.min)}, если начать сейчас</span>`:""}</div>
  </section>
  <div class="bar">
    <p class="count">${list.length?`${list.length} ${plural(list.length,"фильм","фильма","фильмов")} <span>на этот вечер</span>`:"Пока ничего"}</p>
    ${list.length>1?`<button class="btn" id="pick">Выбрать за меня</button>`:""}
  </div>
  ${list.length?`<div class="grid">${list.map(card).join("")}</div>`:
   `<div class="empty"><h2>Под такой вечер фильмов нет</h2><p>Попробуйте дать себе чуть больше времени или выбрать другое настроение.</p><button class="btn ghost" data-time="999">Показать на весь вечер</button></div>`}
  ${rest.length?`<section class="rest"><h2>Остальная коллекция</h2><p class="sub">Не совпадают по времени или настроению, но тоже стоят внимания.</p><div class="grid">${rest.map(card).join("")}</div></section>`:""}`;
}

function renderFilm(id){
  const f=FILMS.find(x=>x.id===id);
  if(!f){location.hash="";return}
  document.title=f.t+" — Кино на вечер";
  const today=getToday(), chosen=today&&today.id===f.id;
  const overlap=x=>x.m.filter(m=>f.m.includes(m)).length;
  const similar=FILMS.filter(x=>x.id!==f.id&&overlap(x)>0).sort((a,b)=>overlap(b)-overlap(a)||a.min-b.min).slice(0,4);
  const aw=[...f.aw].sort((a,b)=>(a.w==="win"?0:1)-(b.w==="win"?0:1)).slice(0,4);
  app.innerHTML=`
  <a class="back" href="#">← Все фильмы на вечер</a>
  <article class="film">
    <aside>${poster(f,true)}</aside>
    <div>
      <h1>${esc(f.t)}</h1>
      <p class="orig">${esc(f.o)}</p>
      <dl class="facts">
        <div><dt>Год</dt><dd>${f.y}</dd></div>
        <div><dt>${f.countries.length>1?"Страны":"Страна"}</dt><dd>${esc(f.countries.join(", "))}</dd></div>
        <div><dt>${f.d.length>1?"Режиссёры":"Режиссёр"}</dt><dd>${esc(f.d.join(", "))}</dd></div>
        <div><dt>Длительность</dt><dd>${dur(f.min)}</dd></div>
        ${f.age?`<div><dt>Возраст</dt><dd>${esc(f.age)}</dd></div>`:""}
      </dl>
      <div class="clock"><b>${endTime(f.min)}</b><span>закончится, если начать прямо сейчас</span></div>
      <p class="logline">${esc(f.log)}</p>
      <p class="syn">${esc(f.syn)}</p>
      <div class="why"><small>Настроение фильма</small><p>${esc(f.mood)}</p></div>
      <div class="tags">${f.m.map(m=>`<span class="tag">${MOODS.find(x=>x.v===m).tag}</span>`).join("")}${f.genres.map(g=>`<span class="tag">${esc(cap(g))}</span>`).join("")}</div>
      <div class="actions">
        <button class="btn" id="choose" aria-pressed="${chosen}">${chosen?"Выбрано на сегодня":"Смотрю сегодня"}</button>
        <a class="btn ghost" href="https://www.kinopoisk.ru/film/${f.id}/video/" target="_blank" rel="noopener">Трейлер на Кинопоиске</a>
        <a class="btn ghost" href="#">Выбрать другой</a>
      </div>
      ${(f.kp||f.imdb)?`<div class="block"><h2>Рейтинги</h2><div class="scores">${f.kp?`<div><b>${f.kp.toFixed(1)}</b><span>Кинопоиск</span></div>`:""}${f.imdb?`<div><b>${f.imdb.toFixed(1)}</b><span>IMDb</span></div>`:""}</div></div>`:""}
      ${f.cast.length?`<div class="block"><h2>В ролях</h2><ul class="cast">${f.cast.map(p=>`<li>${esc(p.n)}${p.r?`<span>${esc(p.r)}</span>`:""}</li>`).join("")}</ul></div>`:""}
      ${aw.length?`<div class="block"><h2>Награды</h2><ul class="awards">${aw.map(a=>`<li><div>${esc(a.e)}, ${a.y}<br><span style="white-space:normal">${esc(a.c)}</span></div><span>${a.w==="win"?"Победа":"Номинация"}</span></li>`).join("")}</ul></div>`:""}
      ${f.themes.length?`<div class="block"><h2>О чём ещё</h2><div class="tags" style="margin:0">${f.themes.map(t=>`<span class="tag">${esc(cap(t))}</span>`).join("")}</div></div>`:""}
      <div class="block links">${f.kpurl?`<a href="${esc(f.kpurl)}" target="_blank" rel="noopener">Страница на Кинопоиске</a>`:""}</div>
    </div>
  </article>
  ${similar.length?`<section class="more"><h2>С похожим настроением</h2><div class="grid">${similar.map(card).join("")}</div></section>`:""}`;
  window.scrollTo(0,0);
}

function route(){
  const h=location.hash.replace(/^#/,"");
  if(h.startsWith("film/"))renderFilm(h.slice(5)); else renderCatalog();
}
function save(){try{sessionStorage.setItem("knv-filter",JSON.stringify(state))}catch(e){}}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),2200)}

app.addEventListener("click",e=>{
  const el=e.target.closest("button");if(!el)return;
  if(el.dataset.time){state.time=+el.dataset.time;save();renderCatalog();return}
  if(el.dataset.mood){state.mood=el.dataset.mood;save();renderCatalog();return}
  if(el.dataset.focus){const g=document.querySelector(`[aria-labelledby="${el.dataset.focus}"]`);
    (g.querySelector('[aria-pressed="true"]')||g.querySelector("button")).focus();return}
  if(el.id==="pick"){const l=FILMS.filter(fits);const f=l[Math.floor(Math.random()*l.length)];location.hash="film/"+f.id;return}
  if(el.id==="choose"){
    const id=location.hash.slice(6), today=getToday();
    if(today&&today.id===id){try{localStorage.removeItem("knv-today")}catch(e){}toast("Выбор отменён")}
    else{try{localStorage.setItem("knv-today",JSON.stringify({id,date:new Date().toDateString()}))}catch(e){}toast("Хорошего вечера!")}
    renderFilm(id);
  }
});
function tick(){const d=new Date();document.getElementById("now").textContent="Сейчас "+pad(d.getHours())+":"+pad(d.getMinutes())}
window.addEventListener("hashchange",route);
tick();setInterval(tick,30000);
route();
</script>
</body>
</html>
