<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кино на вечер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17121A;--surface:#221A26;--line:#3A2E3F;
  --text:#F2EAE0;--muted:#A3959F;--accent:#E9B949;--accent-ink:#2A1E05;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#17121A;--text:#F2EAE0}}
:root[data-theme="dark"]{--bg:#17121A;--text:#F2EAE0}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
header.top{display:flex;justify-content:space-between;align-items:center;padding:20px 0}
.logo{font-family:var(--display);font-weight:700;font-size:15px;text-decoration:none;display:flex;align-items:center;gap:10px}
.logo i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:glow 2.8s ease-in-out infinite}
.now{color:var(--muted);font-size:14px}

.hero{padding:48px 0 32px}
.sentence{font-family:var(--display);font-weight:500;font-size:clamp(28px,5.2vw,60px);line-height:1.18;margin:0;max-width:22ch;letter-spacing:-.01em}
.slot{border:0;background:none;padding:0;cursor:pointer;font:inherit;color:var(--accent);border-bottom:3px solid var(--accent);line-height:1.05;display:inline-block;transition:color .2s,border-color .2s}
.slot:hover{color:#F7D27A;border-color:#F7D27A}
.slot.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.3)}
.pickers{display:grid;gap:18px;margin-top:36px}
.picker-label{font-size:14px;color:var(--muted);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 16px;font-size:15px;cursor:pointer;transition:background .2s,border-color .2s,color .2s,transform .15s}
.chip:active{transform:scale(.94)}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500;animation:chipIn .3s ease}

.today{display:none;margin:28px 0 0;padding:14px 18px;border:1px solid var(--accent);border-radius:12px;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.today.on{display:flex}
.today a{color:var(--accent);font-weight:500}
.today.on{animation:rise .5s ease both}

.bar{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;padding:28px 0 18px;border-top:1px solid var(--line);margin-top:36px}
.count{margin:0;font-size:18px}
.count span{color:var(--muted)}
.btn{border:0;border-radius:999px;padding:12px 22px;white-space:nowrap;flex-shrink:0;font-weight:500;font-size:15px;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none;display:inline-block;transition:filter .2s,transform .15s,border-color .2s}
.btn:active{transform:scale(.96)}
.btn.ghost:hover{border-color:var(--muted)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn:hover{filter:brightness(1.08)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:32px 20px;padding-bottom:64px}
.card{text-decoration:none;display:block}
.card .poster{transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.card:hover .poster{transform:translateY(-6px) scale(1.02);box-shadow:0 18px 36px -12px rgba(0,0,0,.7),0 0 0 1px rgba(233,185,73,.35)}
.card h3{transition:color .2s}
.card:hover h3{color:var(--accent)}
.card.spin .poster{box-shadow:0 0 0 3px var(--accent),0 0 28px rgba(233,185,73,.5);transform:translateY(-6px)}
.card.won .poster{animation:won .6s ease}
.card h3{font-size:16px;font-weight:500;margin:12px 0 2px;line-height:1.3}
.card p{margin:0;color:var(--muted);font-size:14px}
.card .end{color:var(--text)}
.poster{aspect-ratio:2/3;width:100%;object-fit:cover;border-radius:6px;background:var(--surface)}
.poster.big{border-radius:10px;box-shadow:0 30px 60px -24px rgba(0,0,0,.8)}
/* заглушка, пока у фильма нет постера */
.poster.ph{display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:14px;overflow:hidden;position:relative;
  background:radial-gradient(120% 80% at 20% 0%,hsl(var(--h) 45% 32%),transparent 60%),linear-gradient(160deg,hsl(var(--h) 35% 20%),hsl(calc(var(--h) + 40) 30% 11%))}
.poster.ph::before{content:"";position:absolute;inset:10px;border:1px solid hsl(var(--h) 40% 60% / .25);border-radius:4px}
.poster.ph b{font-family:var(--display);font-weight:500;font-size:17px;line-height:1.15;position:relative;overflow-wrap:anywhere}
.poster.ph small{color:hsl(var(--h) 30% 80% / .75);position:relative}
.poster.ph.big b{font-size:30px}
.tools{display:flex;gap:12px;align-items:center}
.search{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:11px 18px;font:inherit;font-size:15px;color:var(--text);width:min(320px,100%);transition:border-color .2s,box-shadow .2s}
.search::placeholder{color:var(--muted)}
.search:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(233,185,73,.2)}
.loadmore{display:flex;justify-content:center;padding:0 0 64px}
.votes{color:var(--muted);font-weight:400;font-size:14px}
footer a{color:inherit}

.empty{padding:40px 0 64px;max-width:48ch}
.empty h2{font-family:var(--display);font-weight:500;font-size:24px;margin:0 0 8px}
.empty p{color:var(--muted);margin:0 0 20px}

.back{display:inline-flex;gap:8px;align-items:center;text-decoration:none;color:var(--muted);font-size:15px;padding:16px 0 8px}
.back{transition:color .2s,transform .2s}
.back:hover{color:var(--text);transform:translateX(-4px)}
.film{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:56px;padding:24px 0 48px;align-items:start}
.film aside{position:sticky;top:24px}
.film h1{font-family:var(--display);font-weight:700;font-size:clamp(32px,4.6vw,54px);line-height:1.08;margin:0 0 6px;letter-spacing:-.01em}
.orig{color:var(--muted);margin:0 0 24px;font-size:17px}
.facts{display:flex;flex-wrap:wrap;gap:12px 28px;margin:0 0 28px;padding:0}
.facts div{display:flex;flex-direction:column}
.facts dt{font-size:13px;color:var(--muted)}
.facts dd{margin:0;font-weight:500}
.clock{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:0 0 32px;display:flex;gap:16px;align-items:center}
.clock b{font-family:var(--display);font-weight:500;font-size:28px;color:var(--accent);line-height:1;animation:glowText 2.8s ease-in-out infinite}
.clock span{color:var(--muted);font-size:15px;line-height:1.4}
.syn{max-width:62ch;margin:0 0 28px;color:#D9CFC6}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 32px}
.tag{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;color:var(--muted);transition:border-color .2s,color .2s}
.tag:hover{border-color:var(--muted);color:var(--text)}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 40px}
.block{margin:0 0 32px;max-width:62ch}
.block h2{font-size:15px;font-weight:500;color:var(--muted);margin:0 0 10px}
.cast{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 24px}
.cast li span{display:block;color:var(--muted);font-size:14px}
.more{border-top:1px solid var(--line);padding:32px 0 80px}
.more h2{font-family:var(--display);font-weight:500;font-size:22px;margin:0 0 20px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{color:var(--muted);font-size:13px;padding:0 0 32px}

@media (max-width:760px){
  .wrap{padding:0 18px}
  .hero{padding:28px 0 20px}
  .film{grid-template-columns:1fr;gap:28px}
  .film aside{position:static;max-width:260px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 14px}
  .now{display:none}
  .tools{flex-wrap:wrap;width:100%}
  .search{width:100%}
}
/* анимации */
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.85);opacity:.3}100%{transform:none;opacity:1}}
@keyframes chipIn{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 12px var(--accent)}50%{box-shadow:0 0 22px var(--accent)}}
@keyframes glowText{0%,100%{text-shadow:0 0 0 transparent}50%{text-shadow:0 0 16px rgba(233,185,73,.45)}}
@keyframes won{0%{transform:translateY(-6px) scale(1)}40%{transform:translateY(-10px) scale(1.07)}100%{transform:translateY(-6px) scale(1.03)}}
@keyframes posterIn{from{opacity:0;transform:translateY(24px) rotate(-1.5deg) scale(.96)}to{opacity:1;transform:none}}
.enter .sentence{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.enter .pickers>div{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.enter .pickers>div:nth-child(1){animation-delay:.12s}
.enter .pickers>div:nth-child(2){animation-delay:.22s}
.grid .card{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
.reveal{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}
.film aside .poster{animation:posterIn .8s cubic-bezier(.2,.8,.2,1) both}
.film .info>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms + .1s)}
.back{animation:fade .4s ease both}
.empty{animation:rise .5s ease both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="logo" href="#"><i aria-hidden="true"></i>Кино на вечер</a>
    <span class="now" id="now"></span>
  </header>
  <main id="app"></main>
  <footer>Information courtesy of IMDb (<a href="https://www.imdb.com" target="_blank" rel="noopener">imdb.com</a>). Used with permission.<span id="tmdb" hidden> Постеры и описания: <a href="https://www.themoviedb.org" target="_blank" rel="noopener">TMDB</a>. This product uses the TMDB API but is not endorsed or certified by TMDB.</span></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data/films.js"></script>
<script>
const FILMS = window.FILMS || [];
const BY_ID = new Map(FILMS.map(f=>[f.id,f]));
// взвешенный рейтинг, как в топ-250 IMDb: фильмы с небольшим числом оценок тянутся к среднему
for(const f of FILMS)f.s=(f.v*f.imdb+100000*6.8)/(f.v+100000);
const IMG = "https://image.tmdb.org/t/p/";
const PAGE = 48;
const TIMES = [
 {v:105,word:"около полутора часов",chip:"Около 1,5 часа"},
 {v:130,word:"часа два",chip:"Часа два"},
 {v:999,word:"весь вечер",chip:"Весь вечер"}
];
const MOODS = [
 {v:"laugh",word:"посмеяться",tag:"Смешно"},
 {v:"nerve",word:"понервничать",tag:"Напряжённо"},
 {v:"sad",word:"погрустить",tag:"Грустно"},
 {v:"think",word:"подумать",tag:"Заставляет думать"},
 {v:"inspire",word:"вдохновиться",tag:"Вдохновляет"},
 {v:"any",word:"чего угодно",tag:""}
];
const state = {time:105, mood:"laugh", q:""};
try{const s=JSON.parse(sessionStorage.getItem("knv-filter")||"null");if(s){state.time=s.time;state.mood=s.mood}}catch(e){}
const app = document.getElementById("app");
let view=null, changed=null, picking=false, list=[], shown=0;
const calm=matchMedia("(prefers-reduced-motion: reduce)");
const io="IntersectionObserver" in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.08}):null;
function observe(){app.querySelectorAll(".reveal").forEach(el=>io?io.observe(el):el.classList.add("in"))}
// подгрузка следующей страницы, когда низ списка показался на экране
const more="IntersectionObserver" in window?new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting))showMore()},{rootMargin:"600px"}):null;

const pad = n => String(n).padStart(2,"0");
function endTime(min){const d=new Date(Date.now()+min*60000);return pad(d.getHours())+":"+pad(d.getMinutes())}
function dur(min){const h=Math.floor(min/60),m=min%60;return (h?h+" ч ":"")+(m?m+" мин":"")}
function plural(n,a,b,c){const m10=n%10,m100=n%100;if(m10===1&&m100!==11)return a;if(m10>=2&&m10<=4&&(m100<10||m100>=20))return b;return c}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function cap(s){return s[0].toUpperCase()+s.slice(1)}
function num(n){return n.toLocaleString("ru-RU")}
function norm(s){return String(s||"").toLowerCase().replace(/ё/g,"е")}
// имена в базе латиницей: «нолан» ищем ещё и как «nolan»
const TR={а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ж:"zh",з:"z",и:"i",й:"y",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"h",ц:"ts",ч:"ch",ш:"sh",щ:"sch",ъ:"",ы:"y",ь:"",э:"e",ю:"yu",я:"ya"};
function translit(s){return [...s].map(c=>c in TR?TR[c]:c).join("")}
function fits(f){return f.min<=state.time&&(state.mood==="any"||f.m.includes(state.mood))}
function hue(id){let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))%360;return h}

function poster(f,big){
  if(f.p)return `<img class="poster${big?" big":""}" src="${IMG}${big?"w500":"w342"}${f.p}" alt="Постер фильма «${esc(f.t)}»" loading="lazy">`;
  return `<div class="poster ph${big?" big":""}" style="--h:${hue(f.id)}" role="img" aria-label="${esc(f.t)}"><b>${esc(f.t)}</b><small>${f.y}</small></div>`;
}
function card(f,i){
  return `<a class="card" href="#film/${f.id}" data-id="${f.id}" style="--i:${(i||0)%PAGE>12?12:(i||0)%PAGE}">${poster(f)}
    <h3>${esc(f.t)}</h3><p>${f.y} · ${dur(f.min)}, финал в <span class="end">${endTime(f.min)}</span></p></a>`;
}
function getToday(){
  try{const s=JSON.parse(localStorage.getItem("knv-today")||"null");
    if(s&&s.date===new Date().toDateString())return BY_ID.get(s.id)||null;}catch(e){}
  return null;
}

function renderCatalog(){
  const t=TIMES.find(x=>x.v===state.time)||TIMES[0], m=MOODS.find(x=>x.v===state.mood)||MOODS[0];
  const today=getToday();
  const enter=view!=="catalog", popT=!enter&&changed==="time", popM=!enter&&changed==="mood";
  view="catalog";changed=null;
  document.title="Кино на вечер";
  app.innerHTML=`
  <section class="hero${enter?" enter":""}">
    <h1 class="sentence">Сегодня у меня <button class="slot${popT?" pop":""}" data-focus="lt">${t.word}</button>, и хочется <button class="slot${popM?" pop":""}" data-focus="lm">${m.word}</button></h1>
    <div class="pickers">
      <div><p class="picker-label" id="lt">Сколько есть времени</p>
        <div class="chips" role="group" aria-labelledby="lt">${TIMES.map(x=>`<button class="chip" data-time="${x.v}" aria-pressed="${x.v===state.time}">${x.chip}</button>`).join("")}</div></div>
      <div><p class="picker-label" id="lm">Какое настроение</p>
        <div class="chips" role="group" aria-labelledby="lm">${MOODS.map(x=>`<button class="chip" data-mood="${x.v}" aria-pressed="${x.v===state.mood}">${x.v==="any"?"Неважно":cap(x.word)}</button>`).join("")}</div></div>
    </div>
    <div class="today${today?" on":""}">${today?`<span>Вы уже выбрали на сегодня: <a href="#film/${today.id}">${esc(today.t)}</a></span><span style="color:var(--muted)">Финал в ${endTime(today.min)}, если начать сейчас</span>`:""}</div>
  </section>
  <div class="bar">
    <p class="count" id="count"></p>
    <div class="tools">
      <input class="search" id="q" type="search" placeholder="Найти фильм, режиссёра, актёра" value="${esc(state.q)}" aria-label="Поиск по базе">
      <button class="btn" id="pick" hidden>Выбрать за меня</button>
    </div>
  </div>
  <div id="results"></div>`;
  renderResults();
}

// Поиск идёт по всей базе и не зависит от времени и настроения; без поиска — подборка под вечер.
function renderResults(){
  const q=norm(state.q.trim());
  const ql=translit(q), has=s=>{s=norm(s);return s.includes(q)||s.includes(ql)};
  list=q?FILMS.filter(f=>norm(f.t).includes(q)||has(f.o)||f.d.some(has)||f.cast.some(c=>has(c.n)))
        :FILMS.filter(fits);
  list.sort((a,b)=>b.s-a.s);
  shown=0;
  const n=list.length;
  document.getElementById("count").innerHTML=n?`${num(n)} ${plural(n,"фильм","фильма","фильмов")} <span>${q?"по запросу":"на этот вечер"}</span>`:(q?"Ничего не нашлось":"Пока ничего");
  document.getElementById("pick").hidden=n<2;
  const r=document.getElementById("results");
  if(more)more.disconnect();
  if(!FILMS.length){r.innerHTML=`<div class="empty"><h2>База фильмов не загрузилась</h2><p>Файл data/films.js не найден. Соберите его скриптом scripts/build_films.py.</p></div>`;return}
  if(!n){r.innerHTML=q?`<div class="empty"><h2>Такого фильма нет в базе</h2><p>В базе фильмы, у которых на IMDb больше 25 тысяч оценок. Попробуйте другое название — на русском или в оригинале.</p></div>`
    :`<div class="empty"><h2>Под такой вечер фильмов нет</h2><p>Попробуйте дать себе чуть больше времени или выбрать другое настроение.</p><button class="btn ghost" data-time="999">Показать на весь вечер</button></div>`;return}
  r.innerHTML=`<div class="grid" id="grid"></div><div class="loadmore" id="loadmore"><button class="btn ghost" id="moreBtn">Показать ещё</button></div>`;
  showMore();
}
function showMore(){
  const g=document.getElementById("grid");if(!g||shown>=list.length)return;
  const next=list.slice(shown,shown+PAGE);
  g.insertAdjacentHTML("beforeend",next.map((f,i)=>card(f,shown+i)).join(""));
  shown+=next.length;
  const lm=document.getElementById("loadmore");
  if(shown>=list.length){lm.remove();if(more)more.disconnect()}
  else if(more){more.disconnect();more.observe(lm)}
}

function renderFilm(id){
  const f=BY_ID.get(id);
  if(!f){location.hash="";return}
  view="film";
  document.title=f.t+" — Кино на вечер";
  const today=getToday(), chosen=today&&today.id===f.id;
  // похожие: общие жанры весят больше общих настроений, плюс бонус за рейтинг
  const score=x=>x.genres.filter(g=>f.genres.includes(g)).length*2+x.m.filter(m=>f.m.includes(m)).length+(x.s-7)*2;
  const similar=FILMS.filter(x=>x.id!==f.id).map(x=>[score(x),x]).sort((a,b)=>b[0]-a[0]).slice(0,4).map(x=>x[1]);
  const yt="https://www.youtube.com/results?search_query="+encodeURIComponent(`${f.o||f.t} ${f.y} trailer`);
  app.innerHTML=`
  <a class="back" href="#">← Все фильмы на вечер</a>
  <article class="film">
    <aside>${poster(f,true)}</aside>
    <div class="info">
      <h1>${esc(f.t)}</h1>
      ${f.o?`<p class="orig">${esc(f.o)}</p>`:""}
      <dl class="facts">
        <div><dt>Год</dt><dd>${f.y}</dd></div>
        ${f.d.length?`<div><dt>${f.d.length>1?"Режиссёры":"Режиссёр"}</dt><dd>${esc(f.d.join(", "))}</dd></div>`:""}
        <div><dt>Длительность</dt><dd>${dur(f.min)}</dd></div>
        <div><dt>IMDb</dt><dd>${f.imdb.toFixed(1)} <span class="votes">· ${num(f.v)} ${plural(f.v,"оценка","оценки","оценок")}</span></dd></div>
      </dl>
      <div class="clock"><b>${endTime(f.min)}</b><span>закончится, если начать прямо сейчас</span></div>
      ${f.syn?`<p class="syn">${esc(f.syn)}</p>`:""}
      <div class="tags">${f.m.map(m=>`<span class="tag">${MOODS.find(x=>x.v===m).tag}</span>`).join("")}${f.genres.map(g=>`<span class="tag">${esc(cap(g))}</span>`).join("")}</div>
      <div class="actions">
        <button class="btn" id="choose" aria-pressed="${chosen}">${chosen?"Выбрано на сегодня":"Смотрю сегодня"}</button>
        <a class="btn ghost" href="${yt}" target="_blank" rel="noopener">Найти трейлер</a>
        <a class="btn ghost" href="https://www.imdb.com/title/${f.id}/" target="_blank" rel="noopener">Страница на IMDb</a>
      </div>
      ${f.cast.length?`<div class="block"><h2>В ролях</h2><ul class="cast">${f.cast.map(p=>`<li>${esc(p.n)}${p.r?`<span>${esc(p.r)}</span>`:""}</li>`).join("")}</ul></div>`:""}
    </div>
  </article>
  ${similar.length?`<section class="more reveal"><h2>Похожие фильмы</h2><div class="grid">${similar.map((f,i)=>card(f,i)).join("")}</div></section>`:""}`;
  app.querySelectorAll(".info>*").forEach((el,i)=>el.style.setProperty("--i",i));
  window.scrollTo(0,0);
}

function route(){
  const h=location.hash.replace(/^#/,"");
  if(h.startsWith("film/"))renderFilm(h.slice(5)); else renderCatalog();
  observe();
}
function save(){try{sessionStorage.setItem("knv-filter",JSON.stringify({time:state.time,mood:state.mood}))}catch(e){}}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),2200)}

app.addEventListener("input",e=>{
  if(e.target.id!=="q")return;
  clearTimeout(app.qt);app.qt=setTimeout(()=>{state.q=e.target.value;renderResults()},150);
});
app.addEventListener("click",e=>{
  const el=e.target.closest("button");if(!el)return;
  if(picking)return;
  if(el.dataset.time){if(state.time!==+el.dataset.time)changed="time";state.time=+el.dataset.time;state.q="";save();renderCatalog();observe();return}
  if(el.dataset.mood){if(state.mood!==el.dataset.mood)changed="mood";state.mood=el.dataset.mood;state.q="";save();renderCatalog();observe();return}
  if(el.dataset.focus){const g=document.querySelector(`[aria-labelledby="${el.dataset.focus}"]`);
    (g.querySelector('[aria-pressed="true"]')||g.querySelector("button")).focus();return}
  if(el.id==="moreBtn"){showMore();return}
  if(el.id==="pick"){roulette();return}
  if(el.id==="choose"){
    const id=location.hash.slice(6), today=getToday();
    if(today&&today.id===id){try{localStorage.removeItem("knv-today")}catch(e){}toast("Выбор отменён")}
    else{try{localStorage.setItem("knv-today",JSON.stringify({id,date:new Date().toDateString()}))}catch(e){}toast("Хорошего вечера!")}
    renderFilm(id);
  }
});
// «Выбрать за меня»: случайный фильм из лучших в подборке. Если он среди первых карточек —
// подсветка бежит по ним, замедляется и останавливается на нём.
function roulette(){
  const pool=list.slice(0,Math.max(24,Math.ceil(list.length*.05)));
  const f=pool[Math.floor(Math.random()*pool.length)];
  const cards=[...document.querySelectorAll("#grid .card")].slice(0,12);
  const target=cards.findIndex(c=>c.dataset.id===f.id);
  const go=()=>{picking=false;location.hash="film/"+f.id};
  if(calm.matches||cards.length<2){go();return}
  picking=true;
  // если выпал фильм дальше по списку, рулетка всё равно крутится и «уезжает» к нему
  const steps=cards.length*2+(target<0?cards.length-1:target);
  let i=0;
  (function step(){
    cards.forEach(c=>c.classList.remove("spin"));
    const c=cards[i%cards.length];c.classList.add("spin");
    if(i>=steps){if(target>=0)c.classList.add("won");else{c.classList.remove("spin");toast("Выпал «"+f.t+"»")}setTimeout(go,650);return}
    i++;setTimeout(step,60+Math.pow(i/steps,3)*260);
  })();
}
function tick(){const d=new Date();document.getElementById("now").textContent="Сейчас "+pad(d.getHours())+":"+pad(d.getMinutes())}
if(FILMS.some(f=>f.p))document.getElementById("tmdb").hidden=false;
window.addEventListener("hashchange",route);
tick();setInterval(tick,30000);
route();
</script>
